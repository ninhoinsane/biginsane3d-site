<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="refresh" content="1; url=http://192.168.1.66:8800/analise">
<title>Balança da casa</title>
<style>
  :root { --bg: #f5f5f2; --card: #fff; --ink: #1c1d1f; --muted: #6b6f76; --line: #e3e3de; --accent: #1f7a5a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121315; --card: #1b1d20; --ink: #ececea; --muted: #9a9ea6; --line: #2b2e33; --accent: #4cc292; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 8px 0; color: var(--muted); }
  a.btn { display: inline-block; margin-top: 12px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; padding: 12px 20px; border-radius: 10px; }
</style>
</head>
<body>
<main>
  <h1>⚖️ Balança da casa</h1>
  <p>Abrindo…</p>
  <a class="btn" href="http://192.168.1.66:8800/analise">Abrir a balança</a>
  <p style="margin-top:16px">Se não abrir: conecte no <b>Wi-Fi de casa</b> e veja se o PC está ligado.</p>
</main>
</body>
</html>
